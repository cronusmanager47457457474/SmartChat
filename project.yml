name: SmartChat
options:
  bundleIdPrefix: com.smartchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  SmartChat:
    type: application
    platform: iOS
    sources:
      - SmartChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartchat.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "SmartChat"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "SmartChat needs photo access so you can send images to the AI."
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SmartChat:
    build:
      targets:
        SmartChat: all
    run:
      config: Debug
    archive:
      config: Release